<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Inter', sans-serif; color: #333; }
  .signature { display: flex; align-items: center; gap: 20px; }
  .logo { width: 100px; height: auto; }
  .divider { width: 1px; height: 60px; background-color: #ddd; }
  .info { font-size: 14px; line-height: 1.4; }
  .name { font-weight: bold; font-size: 16px; color: #000; }
  .role { color: #666; margin-bottom: 4px; }
  .company { font-weight: bold; color: #8B5CF6; } /* Light Purple */
  .contact a { color: #333; text-decoration: none; }
</style>
</head>
<body>

<div class="signature">
  <img src="https://devedge.com.au/images/logo-email.png" alt="DevEdge Solutions" class="logo">
  <div class="divider"></div>
  <div class="info">
    <div class="name">Your Name</div>
    <div class="role">Founder & Director</div>
    <div class="company">DevEdge Solutions</div>
    <div class="contact">
      <a href="https://devedge.com.au">devedge.com.au</a>
    </div>
  </div>
</div>

</body>
</html>
